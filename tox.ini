[tox]
requires = tox>=4.20
env_list = py315, py314, py313, py312, py311, docs, lint
skip_missing_interpreters = true

[testenv]
description = Run the unit tests on {base_python}
package = wheel
wheel_build_env = .pkg
deps =
    -r requirements-dev.txt
# The tests find compilers, MPI and Cray settings from the environment.
pass_env = *
# Coverage writes .coverage and coverage.xml in the repository root, where CI collects coverage.xml.
commands =
    coverage run -p scripts/run_tests.py {posargs:-U}
commands_post =
    coverage combine
    coverage xml

[testenv:docs]
description = Build the HTML documentation
base_python = py315
# Only the test environments collect coverage.
commands_post =
commands_pre =
    python -c "import glob, os; [os.remove(path) for path in glob.glob('docs/modules.rst') + glob.glob('docs/taucmdr*.rst')]"
commands =
    python -m sphinx.ext.apidoc -M -P -f -e -o docs packages/taucmdr packages/taucmdr/_vendor
    python -m sphinx -b html -d build/sphinx/doctrees docs build/sphinx/html

[testenv:lint]
description = Check the pylint score
base_python = py315
commands_post =
commands =
    python scripts/run_tests.py -U taucmdr.tests.test_pylint
